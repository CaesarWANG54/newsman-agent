[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "newsman-agent-backend"
version = "0.1.0"
description = "FastAPI backend and agent pipeline for NewsMan Agent."
license = {text = "All Rights Reserved"}
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "celery>=5.4.0",
    "feedparser>=6.0.11",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "openai>=1.84.0",
    "pgvector>=0.3.6",
    "playwright>=1.46.0",
    "psycopg[binary]>=3.2.1",
    "pydantic-settings>=2.4.0",
    "python-dateutil>=2.9.0",
    "redis>=5.0.8",
    "sqlalchemy>=2.0.32",
    "trafilatura>=1.12.0",
    "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "ruff>=0.6.2",
]

[tool.setuptools.packages.find]
include = ["newsman*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
